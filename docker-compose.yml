# serve, dist and build all run the default Dockerfile stage with the source
# volume-mounted, so they share one image (built once, one CI layer cache).
x-site-image: &site_image
  image: orionrobots-site:dev
  build:
    context: .
    dockerfile: Dockerfile

# Apache serving the built site: one image/stage for staging and http_serve.
x-httpd-serve: &httpd_serve
  build:
    context: .
    dockerfile: Dockerfile
    target: httpd_serve
  healthcheck:
    test: [ "CMD", "curl", "-o", "/dev/null", "-s", "http://localhost" ]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  profiles:
    - manual

services:
  serve:
    <<: *site_image
    command: [ "npm", "run", "serve" ]
    volumes:
      - .:/app/src
      - /app/src/node_modules
    ports:
      - 8081:8081
    depends_on:
      dist:
        condition: service_completed_successfully

  dist:
    <<: *site_image
    command: [ "npm", "run", "dist" ]
    volumes:
      - .:/app/src
      - /app/src/node_modules

  build:
    <<: *site_image
    command: [ "npm", "run", "11ty" ]
    volumes:
      - .:/app/src
      - /app/src/node_modules
    depends_on:
      dist:
        condition: service_completed_successfully
    profiles:
      - manual

  dist_clean:
    image: node:25-bullseye
    working_dir: /app/src
    volumes:
      - .:/app/src
    command: [ "rm", "-rf", "dist" ]
    profiles:
      - manual

  clean:
    image: node:25-bullseye
    working_dir: /app/src
    volumes:
      - .:/app/src
    command: [ "rm", "-rf", "_site" ]
    profiles:
      - manual

  shell:
    build:
      context: .
      dockerfile: Dockerfile
      target: debug
    command: [ "bash" ]
    volumes:
      - .:/app/src
      - /app/src/node_modules
    ports:
      - 8081:8081
    stdin_open: true
    tty: true
    profiles:
      - manual

  # Run after build. Serves ./_site (mounted) with the staging Apache config; the
  # site's own .htaccess is applied on top, as on the hosting. Local: also mounts
  # the live ./htaccess so edits apply without rebuilding the site.
  http_serve:
    <<: *httpd_serve
    volumes:
      - ./_site:/usr/local/apache2/htdocs/
      - ./htaccess:/usr/local/apache2/htdocs/.htaccess
    ports:
      - 8082:80

  broken_links:
    build:
      context: .
      dockerfile: Dockerfile
      target: broken_link_checker
    command: [ "http://http_serve" ]
    profiles:
      - manual

  # Staging service for on_call_staging_test workflow: _site is mounted read-only,
  # so the image is the same for every site build (and cached).
  staging:
    <<: *httpd_serve
    volumes:
      - ./_site:/usr/local/apache2/htdocs/:ro
    ports:
      - 8080:80

  # BDD Testing service
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: tests
    volumes:
      - ./tests:/app/src/tests
      - ./package.json:/app/src/package.json
      - ./package-lock.json:/app/src/package-lock.json
    profiles:
      - manual

  # Page performance / Core Web Vitals measurement
  # Usage (production):  docker compose run perf
  # Usage (local):       BASE_URL=http://serve:8081 docker compose run perf
  # See .env.example for all configuration options.
  perf:
    build:
      context: .
      dockerfile: Dockerfile
      target: tests
    volumes:
      - .:/app/src
      - /app/src/node_modules
    env_file:
      - path: .env
        required: false
    command: [ "node", "tests/perf/measure-vitals.js" ]
    profiles:
      - manual
