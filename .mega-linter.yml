---
# We'll turn them on again later - but turn a number off for now.
# Priority will be given to security, github actions, JS and MD. Then CSS, then secondary other files.
DISABLE_LINTERS:
  - COPYPASTE_JSCPD
  - DOCKERFILE_HADOLINT
  - REPOSITORY_CHECKOV
  - REPOSITORY_TRIVY
  - REPOSITORY_KICS
  - C_CPPLINT
  - CPP_CPPLINT
  - CSS_STYLELINT
  - HTML_HTMLHINT
  - JSON_JSONLINT
  - JSON_PRETTIER
  - JAVASCRIPT_STANDARD
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - MARKDOWN_MARKDOWNLINT
  - YAML_PRETTIER
  - YAML_YAMLLINT
  - PYTHON_ISORT
  - PYTHON_RUFF
  - PYTHON_PYRIGHT
  - PYTHON_PYLINT
  - SPELL_CSPELL
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - SPELL_LYCHEE
  - HTML_DJLINT
# There are things like scripts that shouldn't be in drafts
FILTER_REGEX_EXCLUDE: '^_drafts/.*'

# Ratchet: the "On PR Lint" job no longer sets continue-on-error, so failures
# among the linters above now block a PR. These were already failing when
# that gate went live, so they're listed here to run and report but not block,
# instead of being silently masked. Fix the underlying issue and remove the
# entry rather than leaving it here - this list should only shrink.
DISABLE_ERRORS_LINTERS:
  - ACTION_ZIZMOR # 401 from GitHub API mid-audit, needs investigating separately from code fixes
  - C_CPPCHECK # invalid C syntax in old blog-post demo snippets under assets/galleries
  - CPP_CPPCHECK # same demo snippets, matched again under the .h extension
