---
name: "Eleventy Site Build Smoke Test"
on:
  workflow_call:

jobs:
  eleventy_smoke_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Reuse the site built by build_site rather than running a second full
      # 11ty build (and webpack) just to smoke test it.
      - name: Fetch site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: _site

      - name: Extract site artifact
        run: tar -xf _site.tar

      - name: Run eleventy smoke checks
        id: smoke_test
        env:
          SMOKE_SKIP_BUILD: '1'
        run: npm run test:smoke:eleventy

      - name: Update PR comment with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const outcome = '${{ steps.smoke_test.outcome }}';
            const status = outcome === 'success' ? '✅ Passed' : '❌ Failed';
            const buildTime = '${{ steps.smoke_test.outputs.build_time }}' || 'N/A';
            const siteSize = '${{ steps.smoke_test.outputs.site_size }}' || 'N/A';
            const fileCount = '${{ steps.smoke_test.outputs.file_count }}' || 'N/A';

            const commentBody = [
              '## 🏗️ Eleventy Site Build Smoke Test',
              '',
              '| | |',
              '|---|---|',
              `| **Status** | ${status} |`,
              `| **Build Time** | ${buildTime} |`,
              `| **Site Size** | ${siteSize} |`,
              `| **HTML Files** | ${fileCount} |`,
              '',
              `_Updated: ${new Date().toUTCString()}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('🏗️ Eleventy Site Build Smoke Test'),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
              console.log('Created new comment');
            }
