---
on:
  workflow_call:
    inputs:
      tags:
        description: 'Cucumber tag expression selecting which BDD scenarios to run (default: all)'
        required: false
        type: string
        default: ''
      test_image_tag:
        description: 'Tag of the prebuilt test image on ghcr.io (empty: build it here)'
        required: false
        type: string
        default: ''
      httpd_image_tag:
        description: 'Tag of the prebuilt httpd (staging) image on ghcr.io (empty: build it here)'
        required: false
        type: string
        default: ''

jobs:
  staging_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CACHE_IMAGE: orionrobots/orionrobots-site
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
      TEST_IMAGE_TAG: ${{ inputs.test_image_tag }}
      HTTPD_IMAGE_TAG: ${{ inputs.httpd_image_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: _site
      - name: extract site artifact
        run: |
          tar -xf _site.tar

      - name: Login to Docker
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # compose names its `test` and `staging` images after these tags
      # (docker-compose.ci.yml), so a successful pull means compose does not
      # build. An empty tag or failed pull sets missing=true and compose builds
      # the image from the Dockerfile instead (needs buildx, set up below).
      - name: Pull the prebuilt images
        id: pull
        run: |
          pull() { docker pull "ghcr.io/orionrobots/orionrobots-site.$1:$2"; }
          pull test "${TEST_IMAGE_TAG}" & test_pid=$!
          pull staging "${HTTPD_IMAGE_TAG}" & httpd_pid=$!
          missing=false
          wait "$test_pid" || missing=true
          wait "$httpd_pid" || missing=true
          if [ "$missing" = true ]; then
            echo "::notice::a prebuilt image was not in the registry; compose will build it"
          fi
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx (fallback image build only)
        if: steps.pull.outputs.missing == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run as service and test
        env:
          BDD_TAGS: ${{ inputs.tags }}
        run: |
          bdd_args=()
          if [ -n "$BDD_TAGS" ]; then
            bdd_args+=(--tags "$BDD_TAGS")
          fi

          # Start the staging service using docker compose with --wait for health checks.
          # No --build: use the pulled image; compose only builds it if it is missing.
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait staging
          
          # Perform the tests
          set +e  # Don't exit on error so we can clean up
          set -o pipefail  # Ensure pipeline returns exit code of first failing command
          exit_code=0
          
          curl -I -f http://localhost:8080/ || exit_code=1
          curl -I -f http://localhost:8080/construction_guide.html || exit_code=1
          curl -I -f http://localhost:8080/wiki/lego || exit_code=1
          
          # Run BDD integration tests using docker compose
          echo "## BDD Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run test npm run test:bdd -- "${bdd_args[@]}" 2>&1 | tee bdd_output.txt
          bdd_result=$?
          
          # Filter output to show only BDD test results, excluding Docker build output
          # Look for lines starting with "> orionrobots.github.io@" and capture everything after that
          awk '
            /^> orionrobots\.github\.io@/ { found=1 }
            found { print }
          ' bdd_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          
          if [ $bdd_result -eq 0 ]; then
            echo "✅ BDD tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ BDD tests failed" >> "$GITHUB_STEP_SUMMARY"
            exit_code=1
          fi
          
          # Stop the service regardless of test outcome
          docker compose -f docker-compose.yml -f docker-compose.ci.yml stop staging
          
          # Exit with the test result
          exit $exit_code
