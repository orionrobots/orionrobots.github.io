---
on:
  workflow_call:
    inputs:
      push_tag:
        description: 'Tag to push the base image with (optional)'
        required: false
        type: string

jobs:
  build_site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CACHE_IMAGE: orionrobots/orionrobots-site
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to Docker
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Only needed to publish the base image. The compose build below builds
      # the Dockerfile itself (with registry layer cache), so a Dockerfile
      # break is still caught on every PR. push_tag is set when the Dockerfile,
      # package*.json, compose files or these workflows change, and on master.
      - name: Build base image
        if: inputs.push_tag
        env:
          push_tag: ${{ inputs.push_tag }}
        run: |
          docker build --target base -t "ghcr.io/orionrobots/orionrobots-site.base:${push_tag}" .

      # eleventy-img skips any output file that already exists, and output
      # names embed a content hash, so restoring last run's generated images
      # is safe: changed sources get new names, unchanged ones are skipped.
      # The key is unique per run so the newest cache is always saved; the
      # restore prefix pulls the latest one, scoped to the image code so a
      # change to widths/formats starts from a clean slate.
      - name: Restore generated images cache
        id: image_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _site/assets/images
            _site/assets/thumbnails
          key: eleventy-img-${{ hashFiles('src/shortcodes/**', 'src/thumbnails.js', 'src/fetch_image.js', 'package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            eleventy-img-${{ hashFiles('src/shortcodes/**', 'src/thumbnails.js', 'src/fetch_image.js', 'package-lock.json') }}-

      # One image for dist (webpack) and build (11ty); the CI compose override
      # makes dist the only service that builds it, using the registry layer
      # cache, so the Dockerfile is built once per run and only re-executed
      # where its inputs changed.
      - name: Build the site image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build dist

      - name: Build the site with docker compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run build

      - name: Save generated images cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _site/assets/images
            _site/assets/thumbnails
          key: ${{ steps.image_cache.outputs.cache-primary-key }}

      - name: Tarball the site
        run: |
          # Uncompressed: the site is mostly already-compressed images, and the
          # artifact upload does its own compression pass anyway.
          tar -cf _site.tar _site

      - name: upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: _site
          path: _site.tar
          compression-level: 0
          if-no-files-found: error

      - name: upload httpd.conf artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: httpd.conf
          path: .github/scripts/staging/httpd.conf
          if-no-files-found: error

      - name: Push base image
        if: inputs.push_tag
        env:
          push_tag: ${{inputs.push_tag }}
        run: |
          docker push "ghcr.io/orionrobots/orionrobots-site.base:${push_tag}"
