---
version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      artifact-handling:
        patterns:
          - "actions/download-artifact"
          - "actions/upload-artifact"
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    allow:
      - dependency-type: "all"
    ignore:
      # TypeScript 7 blocked by `npm run lint:ts`: stable typescript-eslint
      # (pulled in via neostandard) supports `typescript <6.1.0` only, and
      # crashes loading TS 7's restructured package exports. Smoke tests
      # (tsx) already pass on TS 7. Remove once a stable typescript-eslint
      # release supports TS 7 and lint:ts passes with it (see issue #449).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
